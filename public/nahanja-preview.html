.entry .entry-guide{width:min(100%,740px);margin:0 auto 27px;padding:20px 24px 15px;text-align:right;border:1px solid #bcc5ad;background:#f8f5ecef;border-radius:26px;box-shadow:0 12px 40px #19332b08}
.entry-guide h2{font-size:21px;font-weight:400;margin:0 0 17px;text-align:center}
.entry-guide ol{display:grid;grid-template-columns:repeat(3,1fr);list-style:none;padding:0;margin:0;gap:18px}
.entry-guide li{display:flex;align-items:flex-start;gap:10px}
.entry-guide .guide-number{display:grid;place-items:center;flex:none;width:28px;height:28px;border:1px solid #bbc5af;border-radius:50%;background:#e4e8d9;font-size:15px}
.entry-guide strong{font-size:17px;font-weight:400;display:block}
.entry-guide li p{font-size:14px;line-height:1.9;margin:5px 0 0;color:#475a49}
.entry-guide .guide-skip{border-top:1px solid #d4dac9;padding-top:12px;margin:16px 0 0;text-align:center;font-size:14px;color:#475a49}
#nahanja-app .entry{padding-top:36px;padding-bottom:32px}
#nahanja-app .entry h1{font-size:clamp(38px,3.6vw,56px);line-height:1.5}
#nahanja-app .entry .intro-copy{font-size:20px;margin:12px auto 20px}
#nahanja-app .entry .entry-caption{inset-inline-start:-145px;font-size:17px}
@media(max-width:620px){.entry-guide ol{grid-template-columns:1fr;gap:14px}.entry .entry-guide{padding:18px}.entry-guide h2{font-size:19px}.entry-guide strong{font-size:18px}.entry-guide li p{font-size:15px}#nahanja-app .entry h1{font-size:36px}}
/* Entry keeps the cinematic material while giving small copy a quiet surface. */
#nahanja-app[data-screen=entry] .scene-backdrop{opacity:.48}
#nahanja-app .home-focus:before{opacity:.045}
#nahanja-app .home-question:before,#nahanja-app .home-audio:before{opacity:.035}

    {id:'begin',title:'ادامه می‌تواند شکل دیگری داشته باشد.',short:'از یک تغییر کوچک.',book:'house',world:'beginning',moods:['change','think'],minutes:3,format:'listen',question:'کوچک‌ترین تغییری که دوست داری چیست؟',words:[['آغاز','beginning'],['انتخاب','choice'],['خانه','home']],paragraphs:['برای شروع دوباره همیشه لازم نیست همه‌چیز را کنار بگذاری. گاهی کافی است پنجره‌ای را که هر روز از کنارش می‌گذری باز کنی.','یک کار کوچک را تصور کن که امروز می‌تواند فرق داشته باشد. نه برای تبدیل‌شدن به آدمی دیگر؛ برای نزدیک‌ترشدن به چیزی که واقعاً می‌خواهی.','شروع، همیشه یک اعلام بزرگ نیست. گاهی تنها یک قدم است.']},
    {id:'home',title:'خانه جایی است که خودت باشی.',short:'معنای تازه‌ی خانه.',book:'house',world:'home',moods:['calm','change'],minutes:7,format:'read',question:'کجا لازم نیست خودت را توضیح بدهی؟',words:[['خانه','home'],['تعلق','home'],['خاطره','memory']],paragraphs:['نشانی بعضی خانه‌ها را نمی‌توان روی نقشه پیدا کرد. جایی‌اند میان یک آغوش، یک گفت‌وگوی بی‌تکلف و اطمینان از اینکه برای ماندن لازم نیست نقش بازی کنیم.','به آخرین باری فکر کن که جایی آسوده بودی. چه چیزی آنجا بود؟ چه چیزی نبود؟ آدم‌ها، صداها و حتی سکوت‌ها چگونه بودند؟','شاید بخشی از خانه، چیزی باشد که می‌توانیم برای دیگری بسازیم: فرصتی برای آنکه بی‌دفاع و بی‌توضیح، خودش باشد.']},

  ];
  /* Explicit-preference ranking: it never infers a user's identity or emotional state.
     A small freshness penalty avoids showing the same saved experience first. */
  function scoreExperience(e,answers={},history=[]){
    const mood=moods[answers.mood]?answers.mood:null;
    const format=['read','listen','both'].includes(answers.format)?answers.format:'both';
    const max=answers.time==='short'?3:answers.time==='medium'?7:Infinity;
    if(e.minutes>max)return {score:-Infinity,reasons:[]};
    const reasons=[];let score=0;
    if(mood&&e.moods.includes(mood)){score+=64;reasons.push('با حال‌وهوای انتخاب‌شده هم‌خوان است');}
    if(format!=='both'&&e.format===format){score+=22;reasons.push('با شیوه‌ی انتخاب‌شده هم‌خوان است');}
    if(format==='both'){score+=6;reasons.push('برای انتخاب آزادِ شیوه مناسب است');}
    if(max!==Infinity){score+=Math.max(0,10-(max-e.minutes)*2);reasons.push('در زمان انتخاب‌شده جا می‌گیرد');}
    if(!history.includes(e.id)){score+=5;reasons.push('در بازدیدهای اخیر تکرار نشده');}
    return {score,reasons};
  }
  function recommend(answers={},history=[]){
    const ranked=experiences.map((e,index)=>({e,index,...scoreExperience(e,answers,history)}))
      .filter(x=>Number.isFinite(x.score)).sort((a,b)=>b.score-a.score||a.index-b.index).map(x=>x.e);
    return ranked.length?ranked:experiences;
  }
  function recommendationReason(e,answers={},history=[]){return scoreExperience(e,answers,history).reasons.slice(0,3);}
  const catalog={moods,books,worlds,experiences,recommend,recommendationReason,scoreExperience};
  if(typeof module!=='undefined'&&module.exports)module.exports=catalog;else root.NahanjaCatalog=catalog;
})(typeof window!=='undefined'?window:globalThis);

    const inRoute=(type,id)=>craftRoute.some(item=>item.type===type&&item.id===id);const lastExperience=[...craftRoute].reverse().find(item=>item.type==='experience');const limit=routeLimit();const limitLabel=Number.isFinite(limit)?fa(limit):'بی‌مرز';

    return `<section class="craft"><div class="craft-heading"><div class="eyebrow">بدون الگوریتم پیشنهاددهنده</div><h1>مسیر خودت را بساز.</h1><p>ایستگاه‌ها را خودت انتخاب و جابه‌جا کن. نهان‌جا هیچ مرحله‌ای را به جای تو انتخاب نمی‌کند.</p></div><div class="craft-layout"><aside class="craft-rules"><span class="craft-mark">${icon('fingerprint')}</span><h2>تو مسیر را تعیین می‌کنی.</h2><p>ترتیب را تغییر بده، هر ایستگاه را باز کن یا پاکش کن. ذخیره فقط با انتخاب تو و در همین مرورگر انجام می‌شود.</p><ul><li>بدون تحلیل شخصیت یا حالت روانی</li><li>بدون پیشنهاد خودکار در این مسیر</li><li>قابل تغییر در هر لحظه</li></ul></aside><div class="craft-board"><div class="craft-board-top"><span>مسیر تو · ${fa(craftRoute.length)} از ${limitLabel} ایستگاه</span>${btn('پاک کردن همه','craft-reset','','quiet-link')}</div>${craftRoute.length?`<ol class="craft-route">${craftRoute.map((item,index)=>`<li><button class="craft-node" data-action="craft-open" data-type="${item.type}" data-id="${item.id}"><b>${fa(index+1)}</b><span><small>${({experience:'تجربه',world:'جهان',book:'کتاب',trace:'ردّ تو'})[item.type]}</small>${craftName(item)}</span>${icon('arrow')}</button><div class="craft-node-actions">${btn('↑','craft-shift',`data-index="${index}" data-direction="-1" ${index?'':'disabled'}`,'')}${btn('↓','craft-shift',`data-index="${index}" data-direction="1" ${index<craftRoute.length-1?'':'disabled'}`,'')}${btn(icon('close'),'craft-remove',`data-index="${index}" aria-label="حذف ${craftName(item)}"`,'')}</div></li>`).join('')}</ol>`:`<div class="craft-empty"><span>${icon('door')}</span><h2>اولین ایستگاه را انتخاب کن.</h2><p>می‌توانی از تجربه، جهان یا کتاب شروع کنی.</p></div>`}<div class="craft-actions">${btn(craftRoute.length?'شروع از ایستگاه اول '+icon('arrow'):'یک ایستگاه انتخاب کن','craft-begin',craftRoute.length?'':'disabled','button primary')}${btn('ذخیره‌ی مسیر من','craft-save',craftRoute.length?'':'disabled','button ghost')}${lastExperience?btn('افزودن ردّ شخصی','craft-add-trace',`data-id="${lastExperience.id}"`,'text-link'):''}</div>${craftRoute.length>=2&&!canUse('personal-route-unlimited')?`<aside class="craft-companion-nudge"><span>${icon('heart')}</span><p>اگر می‌خواهی مسیرهایت با نهان‌جا رشد کنند، همراهی تو کمک می‌کند این فضا برای همه باز بماند.</p>${btn('همراه نهان‌جا چیست؟','support','','text-link')}</aside>`:''}</div></div><section class="craft-library" aria-label="انتخاب ایستگاه‌ها"><div><h2>تجربه‌ها</h2><p>یکی را برای شروع یا ادامه اضافه کن.</p><div class="craft-sources">${C.experiences.map(e=>source('experience',e.id,e.title,`${fa(e.minutes)} دقیقه · ${formatLabels[e.format]}`)).join('')}</div></div><div><h2>جهان‌ها</h2><p>یک لایه‌ی مفهومی به مسیرت اضافه کن.</p><div class="craft-sources">${Object.entries(C.worlds).map(([id,w])=>source('world',id,w.title,w.kicker)).join('')}</div></div><div><h2>کتاب‌ها</h2><p>کتاب را هرجا که خودت خواستی قرار بده.</p><div class="craft-sources">${Object.values(C.books).map(b=>source('book',b.id,b.title,b.author)).join('')}</div></div></section></section>`;
  }
  function contributionQuotaLabel(type){const limit=contributionQuota(type);return Number.isFinite(limit)?fa(contributionCount(type))+' از '+fa(limit):'بی‌مرز';}
  function contributeScreen(){
    const card=type=>{const kind=contributionKinds[type],available=remainingContribution(type)>0,companion=canUse('contribution-unlimited');return `<article class="contribution-type ${available?'':'quota-complete'}"><span class="contribution-type-icon">${icon(kind.icon)}</span><div class="contribution-type-top"><div><span class="fine">${kind.label}</span><h2>${kind.noun} خودت را بیاور.</h2></div><strong>${contributionQuotaLabel(type)}</strong></div><p>${type==='podcast'?'ایده، صدا یا نقش خودت در یک گفت‌وگوی شنیداری.':type==='writing'?'یادداشت، روایت یا متنی که می‌تواند دری به یک کتاب باشد.':'یک تصویر یا مجموعه‌ای که حسِ یک جهان را ادامه می‌دهد.'}</p><footer>${btn(available||companion?'شروع '+kind.label+' '+icon('arrow'):'سهمیهٔ رایگان کامل است','contribute-open',`data-type="${type}" ${available||companion?'':'disabled'}`,'button compact')}${!available&&!companion?btn('دربارهٔ همراهی','support','','text-link'):''}</footer></article>`;};
    return `<section class="contribute"><header class="contribute-hero"><div class="eyebrow">سهم تو در نهان‌جا</div><h1>چیزی را که در تو مانده،<br><em>با نهان‌جا بساز.</em></h1><p>اینجا برای مسابقه و فیدِ شلوغ نیست. یک ایده را آرام و با امکان پیوند به تجربه‌ها، جهان‌ها و کتاب‌ها پیش می‌بریم.</p><div class="contribute-hero-points"><span>${icon('headphones')} پادکست‌های هم‌ساخته</span><span>${icon('pen')} نوشته‌های عضوها</span><span>${icon('spark')} تصویرهای جهان‌ها</span></div></header><section class="contribute-plan-note"><span>${icon('heart')}</span><p><b>نهان‌جا برای همه باز است.</b> در نسخهٔ رایگان می‌توانی یک پادکست، سه نوشته و سه تصویر اضافه کنی. همراهان نهان‌جا فضای بیشتری برای هم‌ساختن، نگه‌داری و ادامه‌دادن پروژه‌ها دارند.</p>${btn('همراه نهان‌جا چیست؟','support','','text-link')}</section><section class="contribution-types" aria-label="سهمیه‌ها و ساخت اثر">${['podcast','writing','image'].map(card).join('')}</section><section class="contribution-principles"><div><span>${icon('fingerprint')}</span><h2>چه چیزی به خانه می‌رسد؟</h2></div><ol><li><b>پیوند واقعی</b><span>اثر باید به یک تجربه، جهان یا کتاب مرتبط باشد.</span></li><li><b>کیفیت و مراقبت</b><span>نمایش عمومی پس از بررسی انسانی انجام می‌شود؛ محبوبیت به‌تنهایی معیار نیست.</span></li><li><b>تازگیِ معنادار</b><span>خانه، تازه‌ترین ردّهای مؤثر و قابل‌اعتنا را با الگوریتمی شفاف نشان می‌دهد.</span></li></ol></section>${contributions.length?`<section class="my-contributions"><div class="my-contributions-head"><div><div class="eyebrow">فقط در این مرورگر</div><h2>پیش‌نویس‌های من</h2></div><span>${fa(contributions.length)} اثر</span></div><div class="my-contribution-list">${contributions.map((item,index)=>`<article><span class="pill">${contributionKinds[item.type].label}</span><div><h3>${esc(item.title)}</h3><p>${esc(item.body.slice(0,160))}${item.body.length>160?'…':''}</p><small>${item.attachment?'فایل انتخاب‌شده: '+esc(item.attachment)+' · ':''}هنوز ارسال عمومی نشده</small></div>${btn(icon('close'),'contribute-delete',`data-index="${index}" aria-label="حذف ${esc(item.title)}"`,'round')}</article>`).join('')}</div></section>`:`<p class="contribution-local-note">پیش‌نویس‌هایی که اینجا می‌سازی فعلاً فقط روی همین دستگاه می‌مانند. در محصول متصل، پس از ارسال و بررسی تحریریه می‌توانند برای دیگران هم دیده شوند.</p>`}</section>`;
  }
  function editorialScreen(kind){
    const isPodcast=kind==='podcasts';const entries=isPodcast?(C.podcasts?.length?C.podcasts.map(item=>({title:item.title,meta:'پادکست نهان‌جا',description:item.description,audioUrl:item.audioUrl,audioEmbedUrl:item.audioEmbedUrl,imageUrl:item.imageUrl})):C.experiences.filter(e=>e.format==='listen').map(e=>({title:e.title,meta:C.worlds[e.world].title+' · '+fa(e.minutes)+' دقیقه',id:e.id,description:'یک دریچهٔ شنیداری برای ادامه‌دادن یک تجربه.'}))):(C.photos?.length?C.photos.map(item=>({title:item.title,meta:C.books[item.book]?.title||'تصویر نهان‌جا',id:C.books[item.book]?item.book:null,description:item.description,imageUrl:item.imageUrl})):Object.values(C.books).map((b,index)=>({title:index===0?'یک نشانه از سکوت':index===1?'آن‌سوی انتخاب':'خانه، پیش از نام',meta:b.title+' · تصویرِ نهان‌جا',id:b.id,description:'یک قاب برای ماندن در حال‌وهوای یک جهان.'})));

  }
  function podcastsScreen(){return editorialScreen('podcasts');}
  function photosScreen(){return editorialScreen('photos');}
  function worldsScreen(){return `<section class="collection-screen"><div class="section-heading"><div class="eyebrow">راه‌های ورود به نهان‌جا</div><h1>از کدام دالان می‌گذری؟</h1><p>یک حس مشترک، چند مسیر متفاوت.</p></div><div class="worlds-garden">${Object.entries(C.moods).map(([id,m])=>`<button class="world-gate" data-action="path" data-id="${id}">${icon(m.icon)}<h2>${m.title}</h2><p>${m.subtitle}</p><span class="round">${icon('arrow')}</span></button>`).join('')}</div><div class="actions">${btn('راهنمای نهان‌جا را بگیرم','start','','button ghost')}${btn('مسیر خودم را بسازم','craft','','button primary')}</div></section>`;}
  function booksScreen(){return `<section class="collection-screen"><div class="section-heading"><div class="eyebrow">پشتِ هر تجربه، یک جهان دیگر</div><h1>کتاب‌ها، ادامه‌ی راه‌اند.</h1><p>لازم نیست از صفحه‌ی اول شروع کنی؛ از یک حس وارد شو.</p></div><div class="shelf">${Object.values(C.books).map(b=>`<button class="shelf-item" data-action="book" data-id="${b.id}">${cover(b)}<span class="shelf-caption">${b.lead}<br><small>${b.author}</small></span></button>`).join('')}</div></section>`;}
  function savedScreen(){const items=C.experiences.filter(e=>bookmarks.has(e.id)||notes[e.id]);return `<section class="collection-screen"><div class="section-heading"><div class="eyebrow">چیزهایی که با تو ماندند</div><h1>ردّ تو در نهان‌جا</h1><p>نشان‌ها و یادداشت‌هایت، فقط در همین مرورگر.</p></div>${!items.length?`<div class="empty-state">${icon('bookmark')}<h2>هنوز ردّی نگه نداشته‌ای.</h2><p>هر تجربه‌ای که با تو ماند، نشان کن یا چند کلمه برای خودت بنویس.</p>${btn('برگردیم به کشف '+icon('arrow'),'home','','button primary')}</div>`:`<div class="saved-grid">${items.map(e=>`<article class="saved-card"><span class="fine">${C.worlds[e.world].title}</span><h2>${e.title}</h2>${notes[e.id]?`<p class="saved-note">${esc(notes[e.id])}</p>`:'<p class="fine">برای دوباره برگشتن.</p>'}<footer>${btn('باز کردن '+icon('arrow'),'experience',`data-id="${e.id}"`,'text-link')}${btn(notes[e.id]?'ویرایش رد':'نوشتن رد','trace',`data-id="${e.id}"`,'quiet-link')}</footer></article>`).join('')}</div>`}</section>`;}
  function miniResult(e){return `<button class="mini-result" data-action="experience" data-id="${e.id}"><span><strong>${e.title}</strong><small>${C.books[e.book].title} · ${fa(e.minutes)} دقیقه</small></span>${icon('arrow')}</button>`;}
  function layerHeader(title){const origin=state.route.screen==='path'?C.moods[activeAnswers().mood].title:state.route.screen==='craft'?'مسیر خودساخته':state.route.screen==='share'?'سهم تو':'کشف آزاد';return `<div class="layer-header"><div class="layer-breadcrumb"><span>${origin}</span>${state.layers.slice(0,-1).map(l=>`${icon('next')}<span>${({experience:'تجربه',book:'کتاب',world:'جهان',trace:'ردّ تو',contribution:'ساخت اثر'})[l.type]||'نهان‌جا'}</span>`).join('')}${icon('next')}<span>${title}</span></div><div class="layer-header-actions">${btn(icon('back'),'layer-back','aria-label="برگشت به لایه‌ی قبل"','round')}${btn(icon('close'),'layer-close','aria-label="بستن همه‌ی لایه‌ها"','round')}</div></div>`;}
  function audioMedia(item){return item.audioUrl?`<audio controls preload="none" src="${esc(item.audioUrl)}" style="width:100%;margin:20px 0"></audio>`:item.audioEmbedUrl?`<iframe title="پخش صوت ${esc(item.title)}" src="${esc(item.audioEmbedUrl)}" loading="lazy" allow="autoplay" referrerpolicy="no-referrer" style="width:100%;height:166px;border:0;margin:20px 0"></iframe>`:'';}
  function player(e){return e.audioUrl||e.audioEmbedUrl?`<div class="audio-state"><span class="fine">${e.title}</span>${audioMedia(e)}<div class="player-meta"><span>صوت تجربه</span><span>${fa(e.minutes)} دقیقه</span></div>${btn('خواندن متن '+icon('book'),'tab','data-tab="read"','text-link')}</div>`:`<div class="audio-state"><span class="fine">${e.title}</span><div class="player-row">${btn(icon('play'),'demo-player','aria-label="نمایش حرکت پخش‌کننده؛ بدون صدا" aria-pressed="false"','round filled')}${wave()}</div><div class="player-meta"><span class="status-label" id="player-label">دموی حرکت پلیر · بدون صدا</span><span>${fa(e.minutes)} دقیقه</span></div><p>فایل صوتی این تجربه هنوز به نمونه اضافه نشده است. فعلاً می‌توانی متن را بخوانی.</p>${btn('خواندن متن '+icon('book'),'tab','data-tab="read"','text-link')}</div>`;}
  function experienceLayer(l){const e=exp(l.id);if(!e)return '';return `${layerHeader('تجربه')}<article class="layer-body"><div class="eyebrow">${C.worlds[e.world].title} · ${fa(e.minutes)} دقیقه</div><h2 id="layer-title" tabindex="-1">${e.title}</h2><p class="layer-lead">در همسایگیِ ${C.books[e.book].title}</p><div class="layer-tabs" role="tablist" aria-label="شیوه‌ی تجربه">${btn(icon('book')+' خواندن','tab',`id="tab-read" role="tab" data-tab="read" aria-selected="${l.tab!=='listen'}" aria-controls="experience-read" tabindex="${l.tab==='listen'?-1:0}"`,'')}${btn(icon('headphones')+' شنیدن','tab',`id="tab-listen" role="tab" data-tab="listen" aria-selected="${l.tab==='listen'}" aria-controls="experience-listen" tabindex="${l.tab==='listen'?0:-1}"`,'')}</div><div id="experience-read" role="tabpanel" aria-labelledby="tab-read" ${l.tab==='listen'?'hidden':''}><div class="prose">${e.paragraphs.map(p=>`<p>${p}</p>`).join('')}</div></div><div id="experience-listen" role="tabpanel" aria-labelledby="tab-listen" ${l.tab!=='listen'?'hidden':''}>${player(e)}</div><div class="keyword-row" aria-label="کلمات، درهای ادامه‌ی تجربه">${e.words.map(([label,id])=>btn(label+' ↖','world',`data-id="${id}"`,'')).join('')}</div><div class="layer-bottom-actions">${btn(icon(bookmarks.has(e.id)?'check':'bookmark')+(bookmarks.has(e.id)?' این رد را نگه داشته‌ای':' این رد را نگه دار'),'bookmark',`data-id="${e.id}" aria-pressed="${bookmarks.has(e.id)}"`,'button compact')}${btn(icon('pen')+' چیزی برای خودم بنویسم','trace',`data-id="${e.id}"`,'button compact ghost')}</div><div class="layer-continuation"><span class="next-label">کنجکاوی‌ات را ادامه بده</span>${btn(`<span>${C.books[e.book].title}<small class="muted" style="display:block">کتابِ پشت این تجربه</small></span>`+icon('arrow'),'book',`data-id="${e.book}"`,'')}</div><p class="editorial-note">متن تألیفیِ نمونه‌ی رابط است؛ نقل‌قولی از کتاب نیست.</p></article>`;}
  function bookLayer(l){const b=C.books[l.id];if(!b)return '';return `${layerHeader('کتاب')}<article class="layer-body"><div class="book-spread"><div><div class="eyebrow">از حس، به کتاب</div><h2 id="layer-title" tabindex="-1">${b.title}</h2><div class="cms-author">${b.authorImageUrl?`<img src="${esc(b.authorImageUrl)}" alt="${esc('تصویر '+b.author)}">`:''}<span class="layer-lead">${b.author}${b.authorBio?`<small>${b.authorBio}</small>`:''}</span></div><div class="prose" style="margin-top:22px"><p>${b.description}</p></div><div class="keyword-row">${b.keywords.map(k=>`<span class="pill">${k}</span>`).join('')}</div></div><div class="book-visual">${cover(b)}</div></div><section class="book-experiences"><h3>دریچه‌های ورود به این کتاب</h3><div class="mini-results">${C.experiences.filter(e=>e.book===b.id).map(miniResult).join('')}</div></section><p class="editorial-note">معرفی کتاب و تجربه‌های مرتبط؛ متن کامل کتاب در این نمونه ارائه نمی‌شود.</p></article>`;}
  function worldLayer(l){const w=C.worlds[l.id];if(!w)return '';const items=C.experiences.filter(e=>e.world===l.id||e.words.some(x=>x[1]===l.id)).slice(0,4);return `${layerHeader('جهان')}<article class="layer-body"><div class="world-symbol">${icon(C.moods[w.mood].icon)}</div><div class="eyebrow">${w.kicker}</div><h2 id="layer-title" tabindex="-1">${w.title}</h2><p class="layer-lead">${w.description}</p><div class="keyword-row">${w.words.map(v=>`<span class="pill">${v}</span>`).join('')}</div><div class="mini-results">${items.map(miniResult).join('')}</div><div class="layer-bottom-actions">${btn('وارد '+C.moods[w.mood].title+' شو '+icon('arrow'),'path',`data-id="${w.mood}"`,'button primary')}</div></article>`;}

  function contributionLayer(l){

  function stopDemo(){demoAnimations.forEach(a=>a.cancel());demoAnimations=[];}
  function renderLayer(){
    stopDemo();const l=state.layers.at(-1);
    if(!l){if(dialog.open){dialog.close();if(lastOpener&&lastOpener.isConnected)lastOpener.focus({preventScroll:true});}lastOpener=null;return;}
    const templates={experience:experienceLayer,book:bookLayer,world:worldLayer,trace:traceLayer,contribution:contributionLayer,search:searchLayer,preferences:preferencesLayer,auth:authLayer,about:aboutLayer,support:supportLayer};
    dialog.className='layer-'+l.type;layerContent.innerHTML=(templates[l.type]||aboutLayer)(l);if(!dialog.open)dialog.showModal();dialog.scrollTop=0;

    if(!reduced.matches){const box=dialog.getBoundingClientRect(),origin=openingRect;const dx=origin?origin.x+origin.width/2-box.x-box.width/2:0,dy=origin?origin.y+origin.height/2-box.y-box.height/2:18;dialog.animate([{opacity:0,transform:`translate(${dx*.3}px,${dy*.3}px) scale(.92)`},{opacity:1,transform:'translate(0,0) scale(1)'}],{duration:520,easing:'cubic-bezier(.22,.8,.22,1)'});}openingRect=null;

  function render(){
    if(state.route.screen==='onboard'){if(state.route.step>1&&!answers.mood)state.route.step=1;else if(state.route.step>2&&!answers.format)state.route.step=2;}
    const routeKey=JSON.stringify(state.route);
    if(routeKey!==renderedBase){
      renderedBase=routeKey;const screens={entry,onboard:onboarding,home,path:pathScreen,craft:craftScreen,share:shareScreen,worlds:worldsScreen,books:booksScreen,podcasts:podcastsScreen,photos:photosScreen,saved:savedScreen};
      app.dataset.screen=state.route.screen;app.dataset.theme=state.route.mood||'paper';document.getElementById('site-header').innerHTML=header();main.innerHTML=(screens[state.route.screen]||entry)();document.getElementById('site-footer').innerHTML=footer();
      const titles={entry:'آغاز کشف',onboard:'مسیر راهنمای نهان‌جا',home:'کشف آزاد',path:C.moods[state.route.mood]?.title,craft:'مسیر خودساخته',share:'سهم تو',worlds:'دالان‌ها',books:'کتاب‌ها',podcasts:'پادکست‌ها',photos:'عکس‌ها',saved:'نشان‌های من'};document.title='نهان‌جا — '+titles[state.route.screen];
      if(!state.layers.length){main.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
      if(!reduced.matches)main.animate([{opacity:0,transform:'translateY(15px)'},{opacity:1,transform:'translateY(0)'}],{duration:620,easing:'cubic-bezier(.22,.8,.22,1)'});
      announce(titles[state.route.screen]);
    }

    renderLayer();
  }
  function refreshBase(){renderedBase='';render();}
  function refreshPanorama(){const current=main.querySelector('.world-carousel');if(!current){refreshBase();return;}current.outerHTML=perspectiveCarousel();}
  function changeTab(tab){const top=state.layers.at(-1);if(top?.type!=='experience')return;top.tab=tab==='listen'?'listen':'read';history.replaceState({nahanja:state},'',routeHash(state));renderLayer();document.getElementById('tab-'+top.tab)?.focus({preventScroll:true});}
  function search(value){const norm=s=>s.replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\u200c/g,' ').trim().toLowerCase();const term=norm(value);const matches=C.experiences.filter(e=>norm([e.title,...e.paragraphs,C.books[e.book].title,C.worlds[e.world].title].join(' ')).includes(term));document.getElementById('search-results').innerHTML=matches.length?matches.map(miniResult).join(''):'<p class="search-empty">روایتی پیدا نشد. یک کلمه‌ی دیگر را امتحان کن.</p>';document.getElementById('search-count').textContent=fa(matches.length)+' تجربه پیدا شد.';}
  app.addEventListener('click',event=>{
    const target=event.target.closest('[data-action]');if(!target||target.disabled)return;const action=target.dataset.action,id=target.dataset.id;
    if(['entry','home','craft','share','worlds','books','podcasts','photos','saved'].includes(action)){go(action);return;}
    if(action==='toggle-mist'){const paused=app.dataset.mistPaused!=='true';app.dataset.mistPaused=String(paused);target.setAttribute('aria-pressed',String(paused));target.textContent=paused?'ادامه‌ی حرکت پس‌زمینه':'توقف حرکت پس‌زمینه';return;}
    if(action==='start'){answers={mood:null,format:null,time:null};remember=false;go('onboard',{step:1});return;}
    if(action==='restart'){go('onboard',{step:1});return;}
    if(action==='resume'&&profile){answers={...profile};pathOffset=0;go('path',{mood:answers.mood});return;}
    if(action==='choose'){answers[target.dataset.key]=target.dataset.value;refreshBase();main.querySelector(`[data-key="${target.dataset.key}"][data-value="${target.dataset.value}"]`)?.focus({preventScroll:true});return;}
    if(action==='previous-step'){state.route.step>1?go('onboard',{step:state.route.step-1}):go('entry');return;}
    if(action==='next-step'){const step=state.route.step;if(!answers[['mood','format','time'][step-1]])return;if(step<3){go('onboard',{step:step+1});}else{pathOffset=0;if(remember){profile={...answers};writeStorage('nahanja-prototype-profile',profile);}else{profile=null;try{localStorage.removeItem('nahanja-prototype-profile');}catch{}}go('path',{mood:answers.mood});}return;}
    if(action==='path'){if(!C.moods[id])return;answers.mood=id;pathOffset=0;go('path',{mood:id});return;}
    if(action==='home-mood'){homeMood=C.moods[target.dataset.mood]?target.dataset.mood:'all';refreshBase();main.querySelector(`[data-mood="${homeMood}"]`)?.focus({preventScroll:true});return;}
    if(action==='perspective-prev'||action==='perspective-next'||action==='perspective-select'){const total=panoramaIds.length;if(!total)return;if(action==='perspective-prev')panoramaIndex=(panoramaIndex-1+total)%total;else if(action==='perspective-next')panoramaIndex=(panoramaIndex+1)%total;else panoramaIndex=Number(target.dataset.index)||0;refreshPanorama();main.querySelector(`[data-panorama-dot="${panoramaIndex}"]`)?.focus({preventScroll:true});return;}
    if(action==='next-recommendation'){pathOffset++;refreshBase();announce('تجربه‌ی دیگری برای این مسیر پیشنهاد شد.');return;}
    if(action==='craft-add'){const item={type:target.dataset.type,id};if(!validCraftItem(item))return;if(craftRoute.some(x=>x.type===item.type&&x.id===item.id)){toast('این ایستگاه از قبل در مسیر توست.');return;}if(craftRoute.length>=routeLimit()){toast('در نسخه‌ی فعلی، هر مسیر تا '+fa(routeLimit())+' ایستگاه دارد.');return;}craftRoute=[...craftRoute,item];refreshBase();announce('ایستگاه به مسیر تو اضافه شد.');return;}
    if(action==='craft-remove'){const index=Number(target.dataset.index);if(Number.isInteger(index)&&craftRoute[index]){craftRoute=craftRoute.filter((_,i)=>i!==index);refreshBase();}return;}
    if(action==='craft-shift'){const index=Number(target.dataset.index),next=index+Number(target.dataset.direction);if(craftRoute[index]&&craftRoute[next]){[craftRoute[index],craftRoute[next]]=[craftRoute[next],craftRoute[index]];craftRoute=[...craftRoute];refreshBase();}return;}
    if(action==='craft-reset'){craftRoute=[];refreshBase();toast('مسیر خودساخته پاک شد.');return;}
    if(action==='craft-save'){writeStorage('nahanja-prototype-self-route',craftRoute);toast('مسیر تو فقط در همین مرورگر نگه داشته شد.');return;}
    if(action==='craft-add-trace'){if(craftRoute.length>=routeLimit()){toast('در نسخه‌ی فعلی، هر مسیر تا '+fa(routeLimit())+' ایستگاه دارد.');return;}if(exp(id)&&!craftRoute.some(item=>item.type==='trace'&&item.id===id)){craftRoute=[...craftRoute,{type:'trace',id}];refreshBase();}return;}
    if(action==='craft-open'){if(['experience','trace'].includes(target.dataset.type)&&exp(id)){openLayer(target.dataset.type,id);return;}if(target.dataset.type==='book'&&C.books[id]){openLayer('book',id);return;}if(target.dataset.type==='world'&&C.worlds[id]){openLayer('world',id);return;}return;}
    if(action==='craft-begin'){const first=craftRoute[0];if(first){if(first.type==='experience'||first.type==='trace')openLayer(first.type,first.id);else openLayer(first.type,first.id);}return;}
    if(action==='contribute-open'){const type=target.dataset.type;if(!contributionKinds[type])return;if(!remainingContribution(type)&&Number.isFinite(contributionQuota(type))){toast('سهمیهٔ رایگان این نوع مشارکت کامل شده است.');return;}openLayer('contribution',type);return;}
    if(action==='contribute-delete'){const index=Number(target.dataset.index);if(Number.isInteger(index)&&contributions[index]){contributions=contributions.filter((_,i)=>i!==index);writeStorage('nahanja-prototype-contributions',contributions);refreshBase();toast('پیش‌نویس حذف شد.');}return;}
    if(['experience','trace'].includes(action)&&exp(id)){openLayer(action,id);if(target.dataset.tab==='listen')changeTab('listen');return;}
    if(action==='book'&&C.books[id]){openLayer('book',id);return;}
    if(action==='world'&&C.worlds[id]){openLayer('world',id);return;}
    if(['search','preferences','about','support'].includes(action)){openLayer(action);return;}if(action==='auth-open'){openLayer('auth');return;}if(action==='switch-auth'){const top=state.layers.at(-1);if(top?.type==='auth'){top.mode=target.dataset.mode==='register'?'register':'signin';renderLayer();}return;}if(action==='signout'){fetch(memberApi+'/signout',{method:'POST',credentials:'same-origin'}).finally(()=>{member=null;closeLayers();refreshBase();toast('از حساب خارج شدی.');});return;}
    if(action==='layer-close'){closeLayers();return;}
    if(action==='layer-back'){backLayer();return;}
    if(action==='tab'){changeTab(target.dataset.tab);return;}
    if(action==='bookmark'){if(bookmarks.has(id))bookmarks.delete(id);else bookmarks.add(id);writeStorage('nahanja-prototype-bookmarks',[...bookmarks]);target.setAttribute('aria-pressed',String(bookmarks.has(id)));target.innerHTML=icon(bookmarks.has(id)?'check':'bookmark')+(bookmarks.has(id)?' این رد را نگه داشته‌ای':' این رد را نگه دار');toast(bookmarks.has(id)?'این تجربه در نشان‌های تو ماند.':'نشان برداشته شد.');if(state.route.screen==='saved')renderedBase='';return;}
    if(action==='forget-profile'){profile=null;remember=false;try{localStorage.removeItem('nahanja-prototype-profile');}catch{}renderLayer();toast('انتخاب‌های ذخیره‌شده فراموش شدند.');return;}
    if(action==='support-interest'){toast('همراهی در این نسخه هنوز فعال نشده؛ تا آن زمان، همه‌ی مسیرهای اصلی باز می‌مانند.');return;}
    if(action==='demo-player'){const active=target.getAttribute('aria-pressed')==='true';stopDemo();target.setAttribute('aria-pressed',String(!active));target.innerHTML=icon(active?'play':'pause');target.setAttribute('aria-label',active?'نمایش حرکت پخش‌کننده؛ بدون صدا':'توقف نمایش حرکت');document.getElementById('player-label').textContent=active?'دموی حرکت پلیر · بدون صدا':'نمایش حرکت · صدایی پخش نمی‌شود';if(!active&&!reduced.matches){target.closest('.audio-state').querySelectorAll('.wave i').forEach((b,i)=>demoAnimations.push(b.animate([{transform:'scaleY(.3)'},{transform:'scaleY(1)'},{transform:'scaleY(.3)'}],{duration:650+i%5*110,iterations:Infinity,delay:i*24})));}return;}
  });
  app.addEventListener('pointermove',event=>{const target=event.target.closest('.nahanja-glow');if(!target)return;const rect=target.getBoundingClientRect();target.style.setProperty('--pointer-x',(event.clientX-rect.left)+'px');target.style.setProperty('--pointer-y',(event.clientY-rect.top)+'px');});
  app.addEventListener('change',e=>{if(e.target.id==='remember')remember=e.target.checked;});
  app.addEventListener('input',e=>{if(e.target.id==='search-input')search(e.target.value);if(e.target.id==='trace-note')document.getElementById('note-count').textContent=fa(e.target.value.length)+' / ۱۲۰۰';});
  app.addEventListener('submit',e=>{if(e.target.id==='auth-signin-form'||e.target.id==='auth-register-form'){e.preventDefault();const isRegister=e.target.id==='auth-register-form',body=Object.fromEntries(new FormData(e.target).entries());fetch(memberApi+(isRegister?'/register':'/signin'),{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(async r=>{const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'ورود انجام نشد.');return data;}).then(data=>{member=data.user;closeLayers();refreshBase();toast(isRegister?'حساب تو ساخته شد.':'خوش آمدی؛ مسیرت منتظر توست.');}).catch(e=>toast(e.message||'اتصال برقرار نشد.'));return;}
    if(e.target.id==='trace-form'){e.preventDefault();const id=e.target.dataset.id,text=document.getElementById('trace-note').value.trim().slice(0,1200);if(!text){toast('چند کلمه بنویس تا ردّت باقی بماند.');document.getElementById('trace-note').focus();return;}notes[id]=text;bookmarks.add(id);writeStorage('nahanja-prototype-notes',notes);writeStorage('nahanja-prototype-bookmarks',[...bookmarks]);if(state.route.screen==='saved')renderedBase='';toast('ردّ تو در همین مرورگر نگه داشته شد.');return;}
    if(e.target.id==='contribution-form'){e.preventDefault();const type=e.target.dataset.type,title=document.getElementById('contribution-title').value.trim().slice(0,120),body=document.getElementById('contribution-body').value.trim().slice(0,1800),file=document.getElementById('contribution-file')?.files?.[0];if(!contributionKinds[type]||!title||!body){toast('عنوان و چند خط توضیح لازم است.');return;}if(!remainingContribution(type)&&Number.isFinite(contributionQuota(type))){toast('سهمیهٔ رایگان این نوع مشارکت کامل شده است.');return;}contributions=[...contributions,{id:'local-'+Date.now(),type,title,body,attachment:file?.name||'',createdAt:Date.now()}];writeStorage('nahanja-prototype-contributions',contributions);closeLayers();refreshBase();toast('پیش‌نویس تو فقط در همین مرورگر نگه داشته شد.');return;}
  });
  app.addEventListener('keydown',e=>{
    const group=e.target.closest('[role=radiogroup]');if(group&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const options=[...group.querySelectorAll('[role=radio]')],i=options.indexOf(e.target),delta=['ArrowLeft','ArrowDown'].includes(e.key)?1:-1;options[(i+delta+options.length)%options.length].click();}
    if(e.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();changeTab(e.key==='Home'?'read':e.key==='End'?'listen':state.layers.at(-1).tab==='listen'?'read':'listen');}
  });
  dialog.addEventListener('cancel',e=>{e.preventDefault();backLayer();});
  dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeLayers();}});
  window.addEventListener('popstate',e=>{state=e.state?.nahanja||parseRoute();render();});
  window.addEventListener('hashchange',()=>{if(routeHash(state)!==location.hash){state=parseRoute();history.replaceState({nahanja:state},'',routeHash(state));render();}});
  reduced.addEventListener('change',()=>{if(reduced.matches)stopDemo();});
  async function loadMember(){try{const r=await fetch(memberApi+'/session',{credentials:'same-origin',cache:'no-store'});const data=await r.json();if(data.user){member=data.user;refreshBase();}}catch{}}
  window.NahanjaApplyRelease=model=>{
    for(const [name,values] of [['moods',model.moods],['books',model.books],['worlds',model.worlds]]){
      for(const key of Object.keys(C[name]))delete C[name][key];
      Object.assign(C[name],values);
    }
    C.experiences.splice(0,C.experiences.length,...model.experiences);
    C.photos=model.photos;
    C.podcasts=model.podcasts;
    const panorama=model.home.panorama.filter(id=>!!exp(id));
    panoramaIds.splice(0,panoramaIds.length,...(panorama.length?panorama:model.experiences.map(item=>item.id)));
    approvedMemberWorks.splice(0,approvedMemberWorks.length,...model.shareWorks);
    communityVoices.splice(0,communityVoices.length,...model.voices);
    homePageCopy=model.home;
    if(homeMood!=='all'&&!C.moods[homeMood])homeMood='all';
    if(!validProfile(profile))profile=null;
    craftRoute=craftRoute.filter(validCraftItem);
    state=parseRoute();history.replaceState({nahanja:state},'',routeHash(state));renderedBase='';render();
    window.dispatchEvent(new CustomEvent('nahanja:release',{detail:{homeShowcase:model.homeShowcase}}));
  };
  state=parseRoute();history.replaceState({nahanja:state},'',routeHash(state));render();loadMember();
})();
 </script>
