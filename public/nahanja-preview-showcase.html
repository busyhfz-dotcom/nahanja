<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نهان‌جا — ویترین اعضا</title>
<style>
html,body,#showcase-preview{width:100%;height:100%;margin:0;border:0;display:block;background:#f2efe5}
</style>
</head>
<body>
<iframe id="showcase-preview" src="nahanja-preview.html" title="نهان‌جا؛ پیش‌نمایش ویترین اعضا"></iframe>
<script>
(() => {
  const frame = document.getElementById("showcase-preview");
  const works = [
    {type:"writing",label:"نوشتهٔ تازه",title:"مکثی میان دو جمله",body:"«سکوت همیشه خالی نیست؛ گاهی جا باز می‌کند تا جواب، با صدای خودش برسد.»",author:"نیلوفر ک.",age:"۵۴ دقیقه پیش"},
    {type:"image",label:"قابِ تازه",title:"پنجره‌ای رو به آغاز",body:"قابی از نورِ اول صبح برای جهان آغاز؛ با یادداشت کوتاهِ صاحب اثر.",author:"پویان م.",age:"۲ ساعت پیش"},
    {type:"podcast",label:"پادکستِ تازه",title:"صدای خانه در عصر بارانی",body:"یک قطعهٔ کوتاه صوتی دربارهٔ بوی چای و خاطره.",author:"آوا ر.",age:"۱۸ دقیقه پیش"}
  ];
  let index = 0, timer, paused = false;

  const icons = {
    writing: '<svg viewBox="0 0 24 24"><path d="m15 4 5 5M3 21l5-1L21 7a2 2 0 0 0-5-5L3 16z"/></svg>',
    image: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.4"/><path d="m3 17 5-5 4 4 3-3 6 6"/></svg>',
    podcast: '<svg viewBox="0 0 24 24"><path d="M3 13v-1a9 9 0 0 1 18 0v1M3 12h3v8H3zM18 12h3v8h-3z"/></svg>',
    next: '<svg viewBox="0 0 24 24"><path d="m14 7-5 5 5 5"/></svg>',
    play: '<svg viewBox="0 0 24 24"><path d="m8 4 12 8-12 8z"/></svg>',
    spark: '<svg viewBox="0 0 24 24"><path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/></svg>'
  };
  const wave = () => '<span class="member-wave">' + Array.from({length:28},(_,i)=>'<i style="--h:'+ (8+(i*13)%32) +'px"></i>').join("") + "</span>";

  function style(doc) {
    if (doc.getElementById("member-showcase-style")) return;
    const css = `
#nahanja-app .member-showcase{position:absolute;top:32px;left:2%;width:31%;min-height:438px;overflow:hidden;text-align:right;border:1px solid #c7cebc;background:#f2efe5;border-radius:23px 23px 62px 23px;box-shadow:0 18px 40px #19332b12;isolation:isolate;transition:transform .45s var(--ease)}
#nahanja-app .member-showcase:hover{transform:translateY(-5px)}
#nahanja-app .member-showcase:before{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 8% 100%,#d8dfc94f 0,transparent 39%),linear-gradient(150deg,transparent 62%,#19332b08 63%,transparent 67%)}
#nahanja-app .member-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 23px 14px;border-bottom:1px solid #d4d8cb;color:#405941}
#nahanja-app .member-kicker{display:flex;align-items:center;gap:8px;font-size:13px}#nahanja-app .member-kicker svg{width:18px;height:18px}#nahanja-app .member-count{font-size:12px;color:#657762}
#nahanja-app .member-stage{display:flex;min-height:285px;padding:17px 23px}#nahanja-app .member-item{width:100%;display:flex;flex-direction:column;justify-content:space-between;animation:member-arrive .62s var(--ease) both}
#nahanja-app .member-type{display:inline-flex;align-items:center;gap:7px;width:max-content;border:1px solid #bac5b2;border-radius:999px;padding:5px 10px;background:#ecefdf;font-size:12px;color:#50684e}#nahanja-app .member-type svg{width:15px;height:15px}
#nahanja-app .member-item h2{margin:14px 0 9px;font-size:28px;line-height:1.62}#nahanja-app .member-writing{padding:20px 17px 15px;border-right:2px solid #9cab8e;background:#f8f6ee;border-radius:16px 5px 16px 16px;font-size:19px;line-height:2}
#nahanja-app .member-image{position:relative;display:grid;min-height:140px;place-items:end start;overflow:hidden;padding:18px;border-radius:18px 18px 6px 18px;background:linear-gradient(145deg,#193c32,#57745c 52%,#d4c68f);color:#f9f7ed;font-size:18px;line-height:1.65}#nahanja-app .member-image:before{content:'';position:absolute;width:250px;height:130px;top:-66px;right:-43px;border:1px solid #f8edca73;border-radius:50%;transform:rotate(-28deg)}
#nahanja-app .member-audio{display:flex;align-items:center;gap:15px;margin-top:8px;padding:17px;border:1px solid #c1cbb5;background:#dce4cf;border-radius:18px 18px 7px 18px}#nahanja-app .member-play{display:grid;flex:none;width:43px;height:43px;place-items:center;border-radius:50%;background:#193c32;color:#f7f3e6}#nahanja-app .member-play svg{width:18px;height:18px;fill:currentColor;stroke:none}
#nahanja-app .member-wave{display:flex;align-items:center;gap:4px;flex:1;height:44px;direction:ltr}#nahanja-app .member-wave i{display:block;height:var(--h);width:2px;background:currentColor;opacity:.7;border-radius:2px}
#nahanja-app .member-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:17px;font-size:13px;color:#566a52}#nahanja-app .member-author{display:flex;align-items:center;gap:8px}#nahanja-app .member-avatar{display:grid;width:29px;height:29px;place-items:center;border-radius:50%;background:#d1dac5;color:#355040;font-size:12px}

/* Page-wide cleanup and the entry-point guide. */
#site-footer{display:none!important;height:0!important;min-height:0!important;margin:0!important;padding:0!important;overflow:hidden!important}
#nahanja-app[data-screen="home"] .home{overflow-x:clip}
#nahanja-app[data-screen="home"] .home-scene{min-height:532px;overflow:clip}
#nahanja-app .home-scene>*{transition:opacity .22s ease,transform .22s ease,visibility .22s ease}
#nahanja-app .home-scene.member-panorama-active>*{opacity:0!important;visibility:hidden!important;pointer-events:none!important;transform:translateY(-16px) scale(.97)!important}
#site-header .site-header{position:relative}
#site-header .entry-header-guide{position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 15px;border:1px solid #9eae97;border-radius:999px;background:#f4f1e8;color:#234237;font:inherit;font-size:15px;font-weight:600;line-height:1;white-space:nowrap;cursor:pointer;opacity:1!important;pointer-events:auto!important;box-shadow:0 5px 16px #19332b14}
#site-header .entry-header-guide:hover,#site-header .entry-header-guide:focus-visible{background:#dfe7d4;border-color:#526d56;outline:none}
#site-header .entry-header-guide svg{width:17px;height:17px}
#nahanja-app .entry-about{display:none!important}
#nahanja-app #layer.member-compact-layer{width:min(560px,calc(100% - 32px))}
#nahanja-app .auth-gate{padding:27px 32px 28px;max-width:560px;margin:auto}
#nahanja-app .auth-gate h2{margin:7px 0 6px;font-size:34px;line-height:1.45}
#nahanja-app .auth-gate>p{margin:6px 0 14px;line-height:1.75}
#nahanja-app .auth-gate .button{padding:12px 18px;font-size:17px}
#nahanja-app .auth-gate .fine{margin-top:12px;font-size:13px}

/* Keep the panorama ending continuous with the paper background. */
#nahanja-app .world-carousel{margin-bottom:0;border-bottom-color:transparent;background:radial-gradient(circle at 50% 0,#fbf8f0 0,rgba(242,239,229,.86) 44%,rgba(218,226,207,.58) 76%,rgba(218,226,207,0) 100%);box-shadow:0 20px 48px #19332b0d}
#nahanja-app .worlds-garden{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:end;gap:25px}
#nahanja-app .world-gate{width:auto;min-width:0;font-family:Dastan,Tahoma,sans-serif}
#nahanja-app .world-gate *{font-family:inherit}
@media(max-width:850px){#nahanja-app .worlds-garden{grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}}
@media(max-width:620px){#site-header .entry-header-guide{font-size:13px}#nahanja-app .worlds-garden{gap:14px}}


#nahanja-app .member-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 18px 18px;border-top:1px solid #d4d8cb}#nahanja-app .member-progress{width:100%;height:3px;overflow:hidden;border-radius:999px;background:#6d846735}#nahanja-app .member-progress i{display:block;width:100%;height:100%;transform-origin:right;background:#4d6b4e;animation:member-progress 5.6s linear both}#nahanja-app .member-showcase:hover .member-progress i{animation-play-state:paused}
#nahanja-app .member-next{display:grid;flex:none;width:38px;height:38px;place-items:center;border:1px solid #bac5b2;border-radius:50%;background:#f8f6ee;color:#345040}#nahanja-app .member-next svg{width:19px;height:19px}
@keyframes member-arrive{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}@keyframes member-progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(max-width:1100px){#nahanja-app .member-showcase{left:2%;width:36%}}@media(max-width:850px){#nahanja-app .member-showcase{left:0;width:39%;min-height:446px}}@media(max-width:620px){#nahanja-app .home-scene{display:flex;flex-direction:column;gap:20px;margin:0 20px}#nahanja-app .home-question,#nahanja-app .home-audio{display:none}#nahanja-app .member-showcase{position:relative;inset:auto!important;order:1;width:91%!important;align-self:flex-start;min-height:405px;transform:none}#nahanja-app .home-book{order:2}#nahanja-app .home-trace{order:3}}
`;
    const tag = doc.createElement("style"); tag.id = "member-showcase-style"; tag.textContent = css; doc.head.appendChild(tag);
  }

  function markup(work) {
    const content = work.type === "writing"
      ? '<div class="member-writing">' + work.body + "</div>"
      : work.type === "image"
        ? '<div class="member-image"><span>' + work.body + "</span></div>"
        : '<div class="member-audio"><span class="member-play">' + icons.play + "</span>" + wave() + "</div>";
    return '<aside class="member-showcase" aria-label="سهم تو؛ آثار تازه اعضا"><header class="member-head"><span class="member-kicker">' + icons.spark + ' سهم تو</span><span class="member-count">' + (index + 1) + ' از ' + works.length + '</span></header><article class="member-stage"><div class="member-item"><div><span class="member-type">' + icons[work.type] + ' ' + work.label + '</span><h2>' + work.title + '</h2>' + content + '</div><footer class="member-meta"><span class="member-author"><b class="member-avatar">' + work.author.charAt(0) + '</b>' + work.author + '</span><span>' + work.age + '</span></footer></div></article><footer class="member-controls"><span class="member-progress" aria-hidden="true"><i></i></span><button type="button" class="member-next" aria-label="اثر بعدی">' + icons.next + '</button></footer></aside>';
  }

  function schedule(doc) {
    clearTimeout(timer);
    if (paused) return;
    timer = setTimeout(() => { index = (index + 1) % works.length; mount(doc); }, 5600);
  }
  function ensureEntryGuide(doc) {
    const content = doc.querySelector(".entry .entry-content");
    content?.querySelector(".entry-about")?.remove();
    const header = doc.getElementById("site-header");
    const headerBar = header?.querySelector(".site-header");
    const isEntry = Boolean(content);
    const existingGuide = headerBar?.querySelector(".entry-header-guide");
    if (!isEntry) existingGuide?.remove();
    else if (headerBar && !existingGuide) {
      const button = doc.createElement("button");
      button.type = "button";
      button.className = "entry-header-guide";
      button.dataset.action = "about";
      button.setAttribute("aria-label", "نهان‌جا چطور کار می‌کند؟");
      button.innerHTML = 'نهان‌جا چطور کار می‌کند؟ ' + icons.next;
      headerBar.appendChild(button);
    }
    const footer = doc.getElementById("site-footer");
    if (footer) {
      if (footer.childNodes.length) footer.replaceChildren();
      Object.assign(footer.style,{display:"none",height:"0",minHeight:"0",margin:"0",padding:"0"});
    }
    const backdrop = doc.querySelector(".scene-backdrop");
    if (backdrop && !doc.body.dataset.memberBackdrop) {
      const style = doc.defaultView.getComputedStyle(backdrop);
      doc.body.style.backgroundImage = style.backgroundImage;
      doc.body.style.backgroundSize = style.backgroundSize;
      doc.body.style.backgroundPosition = style.backgroundPosition;
      doc.body.style.backgroundAttachment = "fixed";
      doc.body.dataset.memberBackdrop = "true";
    }
    const layer = doc.querySelector("#layer");
    if (layer) layer.classList.toggle("member-compact-layer", Boolean(doc.querySelector(".auth-gate")));
  }

  function updatePanoramaTransition(doc) {
    const scene = doc.querySelector(".home-scene");
    const carousel = doc.querySelector(".world-carousel");
    if (!scene || !carousel) return;
    const bounds = carousel.getBoundingClientRect();
    scene.classList.toggle("member-panorama-active", bounds.top < 400 && bounds.bottom > 0);
  }

  function mount(doc) {
    style(doc);
    const scene = doc.querySelector(".home-scene");
    if (!scene) return;
    scene.querySelector(".home-question")?.remove();
    scene.querySelector(".home-audio")?.remove();
    scene.querySelector(".member-showcase")?.remove();
    scene.insertAdjacentHTML("beforeend", markup(works[index]));
    const card = scene.querySelector(".member-showcase");
    card.addEventListener("mouseenter", () => { paused = true; clearTimeout(timer); });
    card.addEventListener("mouseleave", () => { paused = false; schedule(doc); });
    card.querySelector(".member-next").addEventListener("click", () => { index = (index + 1) % works.length; mount(doc); });
    schedule(doc);
  }
  frame.addEventListener("load", () => {
    const doc = frame.contentDocument;
    if (!doc) return;
    // A direct visit starts at the entry screen. The active inner route is
    // mirrored into the page that hosts this preview, so reload keeps the path.
    const hostWindow = window.parent === window ? window : window.parent;
    const outerRoute = hostWindow.location.hash;
    if (outerRoute) frame.contentWindow.location.hash = outerRoute;
    else if (!frame.contentWindow.location.hash) frame.contentWindow.location.hash = "#/entry";
    const syncRoute = () => {
      const currentRoute = frame.contentWindow.location.hash;
      if (currentRoute && hostWindow.location.hash !== currentRoute) {
        hostWindow.history.replaceState(null, "", currentRoute);
      }
    };
    frame.contentWindow.addEventListener("hashchange", syncRoute);
    syncRoute();
    const observe = () => {
      style(doc);
      ensureEntryGuide(doc);
      syncRoute();
      updatePanoramaTransition(doc);
      const scene = doc.querySelector(".home-scene");
      if (scene && !scene.querySelector(".member-showcase")) mount(doc);
    };
    new MutationObserver(observe).observe(doc.body, {childList:true,subtree:true});
    doc.defaultView.addEventListener("scroll", () => updatePanoramaTransition(doc), {passive:true});
    observe();
    updatePanoramaTransition(doc);
  });
})();
</script>
</body>
</html>
