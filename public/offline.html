<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#19332b" />
    <title>نهان‌جا — آفلاین</title>
    <style>
      *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));background:#f2efe5;color:#19332b;font:17px/2 Tahoma,sans-serif;text-align:center}.card{width:min(100%,420px);padding:34px 26px;border:1px solid #b7c3aa;border-radius:70px 22px 22px;background:#f8f5ec;box-shadow:0 18px 44px #19332b16}.mark{width:70px;height:70px;margin:auto;border-radius:22px;background:#19332b;color:#f2efe5;display:grid;place-items:center;font-size:32px}h1{margin:18px 0 6px;font-size:30px}p{margin:0 0 22px}button{min-height:46px;border:0;border-radius:999px;padding:10px 24px;background:#19332b;color:#fff;font:inherit;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">ن</div>
      <h1>راه فعلاً آفلاین است.</h1>
      <p>بخش‌های دیده‌شده روی دستگاه مانده‌اند. برای محتوای تازه، اتصال اینترنت را بررسی کن.</p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
