<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#19332b" />
    <title>نهان‌جا</title>
    <style>
      *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;padding:24px;background:#f2efe5;color:#19332b;font:18px/2 Tahoma,sans-serif;text-align:center}.mark{width:76px;height:76px;margin:auto;border-radius:22px;background:#19332b;color:#f2efe5;display:grid;place-items:center;font-size:34px}h1{margin:18px 0 4px;font-size:32px}p{margin:0;max-width:330px}
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">ن</div>
      <h1>نهان‌جا</h1>
      <p>برای دریافت تازه‌ترین محتوا، اتصال اینترنت را بررسی کن و دوباره وارد برنامه شو.</p>
    </main>
  </body>
</html>
